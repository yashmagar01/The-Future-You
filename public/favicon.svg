<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Background gradient -->
  <rect width="32" height="32" fill="url(#grad)" rx="6"/>
  
  <!-- Video camera icon -->
  <g transform="translate(6, 8)">
    <!-- Camera body -->
    <rect x="0" y="4" width="16" height="10" rx="2" fill="white" opacity="0.95"/>
    
    <!-- Lens -->
    <circle cx="8" cy="9" r="3.5" fill="#9333EA"/>
    <circle cx="8" cy="9" r="2" fill="#C084FC"/>
    
    <!-- Record dot -->
    <circle cx="14" cy="5.5" r="1.5" fill="#EC4899"/>
  </g>
  
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
