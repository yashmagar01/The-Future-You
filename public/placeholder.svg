<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
  <!-- Background with gradient -->
  <rect width="1200" height="1200" fill="url(#bgGradient)" rx="3"/>
  
  <!-- Video camera icon representing reflections -->
  <g transform="translate(300, 300)">
    <!-- Camera body -->
    <rect x="50" y="200" width="500" height="300" rx="30" fill="white" opacity="0.95"/>
    <rect x="50" y="200" width="500" height="300" rx="30" fill="none" stroke="#9333EA" stroke-width="8"/>
    
    <!-- Lens -->
    <circle cx="300" cy="350" r="120" fill="#E9D5FF" opacity="0.8"/>
    <circle cx="300" cy="350" r="120" fill="none" stroke="#9333EA" stroke-width="6"/>
    <circle cx="300" cy="350" r="80" fill="#C084FC"/>
    <circle cx="300" cy="350" r="80" fill="none" stroke="#7C3AED" stroke-width="4"/>
    
    <!-- Record button indicator -->
    <circle cx="470" cy="260" r="20" fill="#EC4899"/>
    
    <!-- Sparkle effects (representing "The Future You") -->
    <g transform="translate(120, 100)">
      <path d="M0,0 L10,30 L0,25 L-10,30 Z" fill="#F472B6" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#FDE68A"/>
    </g>
    
    <g transform="translate(480, 120)">
      <path d="M0,0 L8,24 L0,20 L-8,24 Z" fill="#A78BFA" opacity="0.8"/>
      <circle cx="0" cy="0" r="6" fill="#FDE68A"/>
    </g>
    
    <g transform="translate(150, 450)">
      <path d="M0,0 L6,18 L0,15 L-6,18 Z" fill="#C084FC" opacity="0.8"/>
      <circle cx="0" cy="0" r="5" fill="#FDE68A"/>
    </g>
  </g>
  
  <!-- Brand text -->
  <text x="600" y="900" font-family="Inter, sans-serif" font-size="80" font-weight="700" text-anchor="middle" fill="#7C3AED">
    The Future You
  </text>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF5FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDF2F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>