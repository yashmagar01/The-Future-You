version: '3.8'

services:
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - PORT=8080
    volumes:
      - ./worker/src:/app/src
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
