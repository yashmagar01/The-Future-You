version: '3.8'

services:
  worker:
    build: ./backend/worker
    environment:
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TRANSCRIPTION_API_KEY=${TRANSCRIPTION_API_KEY}
    volumes:
      - ./backend/worker/src:/app/src
    restart: always
